[package]
name = "multi-cursor"
version = "1.0.0"
description = "Multi-Cursor account and environment launcher"
authors = ["you"]
edition = "2021"

[lib]
name = "multi_cursor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { workspace = true }
chrono = { workspace = true }
multi-cursor-core = { workspace = true }
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSAttributedString", "NSDictionary", "NSString", "NSURL", "NSRange"] }
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSScreen", "NSApplication", "NSAttributedString"] }
